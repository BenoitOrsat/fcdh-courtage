<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FCDH Courtiers Associés — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0d1b3e 0%, #1a2f5a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #login-box { background: #fff; border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 380px; box-shadow: 0 24px 64px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; }
    .logo { font-size: 22px; font-weight: 800; color: #0d1b3e; letter-spacing: 0.04em; text-align: center; }
    .logo span { color: #C9A84C; }
    .tagline { font-size: 12px; color: #8a94aa; margin-top: 4px; margin-bottom: 32px; text-align: center; }
    label { align-self: flex-start; font-size: 11px; font-weight: 700; color: #0d1b3e; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; border: 1.5px solid #dde1eb; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; color: #0d1b3e; outline: none; transition: border-color 0.15s; margin-bottom: 18px; }
    input:focus { border-color: #C9A84C; }
    button { width: 100%; background: linear-gradient(135deg, #0d1b3e, #1a2f5a); color: #C9A84C; border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: 0.04em; margin-top: 6px; transition: opacity 0.15s; }
    button:hover { opacity: 0.88; }
    #login-error { font-size: 12px; color: #e05050; font-weight: 600; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <div id="login-box">
    <div class="logo">FCDH <span>Courtiers</span></div>
    <div class="tagline">Tableau de bord — Accès restreint</div>
    <label for="inp-login">Identifiant</label>
    <input type="text" id="inp-login" autocomplete="username" placeholder="votre.login"/>
    <label for="inp-pwd">Mot de passe</label>
    <input type="password" id="inp-pwd" autocomplete="current-password" placeholder="••••••••"/>
    <button id="btn-login">Se connecter</button>
    <div id="login-error"></div>
  </div>

  <script>
    const USERS = [
      { login: 'b.orsat',     password: 'nadia',     role: 'courtier' },
      { login: 'jb.cau',      password: 'mathilde',  role: 'courtier' },
      { login: 'e.bertout',   password: 'frederic',  role: 'courtier' },
      { login: 'ma.daymery',  password: 'carole',    role: 'courtier' },
      { login: 'e.cossiez',   password: 'anne',      role: 'courtier' },
      { login: 'as.malingre', password: 'gauthier',  role: 'courtier' },
      { login: 'as.malingre', password: 'gautier',   role: 'courtier' },
      { login: 'e.heidsieck', password: 'laure',     role: 'courtier' },
      // Correspondants de secteur
      { login: 'k.poulain',  password: 'fcdhae', role: 'correspondant', secteurs: ['A','E'] },
      { login: 'c.chayoux',  password: 'fcdhc',  role: 'correspondant', secteurs: ['C'] },
      { login: 'l.truchon',  password: 'fcdhg',  role: 'correspondant', secteurs: ['G'] },
      { login: 'jb.cau',     password: 'fcdhhi', role: 'correspondant', secteurs: ['H','I'] },
      { login: 'm.scellier', password: 'fcdhdf', role: 'correspondant', secteurs: ['D','F'] },
      { login: 'p.auger',    password: 'fcdhb',  role: 'correspondant', secteurs: ['B'] },
      { login: 'a.vincent',  password: 'fcdhs',  role: 'correspondant', secteurs: ['S'] },
    ];

    const existingUser = sessionStorage.getItem('fcdh_user');
    const existingRole = sessionStorage.getItem('fcdh_role');
    if (existingUser && existingRole) {
      window.location.replace(existingRole === 'correspondant' ? 'index-correspondants.html' : 'index-courtiers.html');
    }

    document.getElementById('btn-login').addEventListener('click', () => {
      const login = document.getElementById('inp-login').value.trim();
      const pwd = document.getElementById('inp-pwd').value;
      const match = USERS.find(u => u.login === login && u.password === pwd);
      if (match) {
        sessionStorage.setItem('fcdh_user', login);
        sessionStorage.setItem('fcdh_role', match.role);
        if (match.role === 'correspondant') {
          sessionStorage.setItem('fcdh_secteurs', JSON.stringify(match.secteurs || []));
        }
        window.location.replace(match.role === 'correspondant' ? 'index-correspondants.html' : 'index-courtiers.html');
      } else {
        document.getElementById('login-error').textContent = 'Identifiant ou mot de passe incorrect.';
        document.getElementById('inp-pwd').value = '';
        document.getElementById('inp-pwd').focus();
      }
    });

    document.getElementById('inp-pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('inp-login').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('inp-pwd').focus();
    });
  </script>
</body>
</html>
