<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centres de pressurage en Champagne — FCDH</title>

<!-- Leaflet 1.9.4 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<!-- Leaflet.markercluster 1.5.3 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --vine:#1F3A2E;
    --vine-dark:#12251C;
    --gold:#C9A66B;
    --gold-light:#E8D9B5;
    --chalk:#F5F1E8;
    --ivory:#EDE7D9;
    --burgundy:#6B2737;
    --ink:#1A1A16;
    --brown:#8C5A3C;
  }

  *{box-sizing:border-box;}

  html, body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--chalk);
  }

  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- En-tête ---------- */
  header{
    flex:0 0 auto;
    background:var(--vine);
    border-bottom:3px solid var(--gold);
    color:var(--chalk);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    gap:16px;
    z-index:1200;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    color:var(--gold);
    text-decoration:none;
    font-size:0.72rem;
    font-weight:600;
    opacity:0.8;
    margin-bottom:6px;
    transition:opacity 0.15s ease;
  }
  .back-btn:hover{
    opacity:1;
  }

  .header-left .eyebrow{
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:0.72rem;
    font-weight:600;
    margin-bottom:4px;
  }

  .header-left h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    color:var(--chalk);
  }

  .update-date{
    font-size:0.68rem;
    color:var(--gold-light);
    opacity:0.75;
    margin-top:4px;
  }

  .header-badge{
    flex:0 0 auto;
    background:var(--gold);
    color:var(--vine-dark);
    font-weight:600;
    padding:7px 16px;
    border-radius:20px;
    font-size:0.8rem;
    white-space:nowrap;
    letter-spacing:0.02em;
  }

  /* ---------- Zone carte ---------- */
  #map-wrapper{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }

  #map{
    position:absolute;
    inset:0;
    background:var(--ivory);
  }

  /* ---------- Bandeau bas ---------- */
  #zoom-banner{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    background:rgba(18,37,28,0.92);
    color:var(--chalk);
    border-top:2px solid var(--gold);
    padding:8px 18px;
    border-radius:20px;
    font-size:0.82rem;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    transition:opacity 0.3s ease;
    pointer-events:none;
  }
  #zoom-banner.hidden{
    opacity:0;
  }

  /* ---------- Panneau de contrôle (style + filtre) ---------- */
  .control-panel{
    background:var(--chalk);
    border:1px solid var(--gold-light);
    border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
    padding:12px;
    width:210px;
    font-size:0.8rem;
    max-height:calc(100vh - 110px);
    overflow-y:auto;
  }

  .panel-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.8rem;
    color:var(--vine);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }

  .basemap-box{
    margin-bottom:14px;
  }

  .style-box{
    margin-bottom:14px;
  }

  .style-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--ivory);
    border:1px solid transparent;
    color:var(--ink);
    padding:7px 10px;
    border-radius:6px;
    margin-bottom:6px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .style-btn:last-child{margin-bottom:0;}
  .style-btn:hover{background:var(--gold-light);}
  .style-btn.active{
    background:var(--vine);
    color:var(--chalk);
    border-color:var(--gold);
    font-weight:600;
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  /* Chaque chip porte la couleur de son courtier en fond permanent (inline
     style), y compris quand il n'est pas sélectionné : l'opacité et le
     liseré distinguent l'état actif de l'état inactif. */
  .chip{
    border:1px solid transparent;
    padding:5px 10px;
    border-radius:14px;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    opacity:0.55;
    transition:opacity 0.15s ease, box-shadow 0.15s ease;
  }
  .chip:hover{opacity:0.85;}
  .chip.active{
    opacity:1;
    box-shadow:0 0 0 2px var(--vine-dark);
  }
  .chip-all{
    background:var(--vine);
    color:var(--chalk);
  }

  /* Chips de secteur : pas de couleur propre par secteur (contrairement aux
     courtiers), fond neutre commun, même logique active/inactive. */
  .filter-box{
    margin-bottom:14px;
  }
  .chip-secteur{
    background:var(--ivory);
    color:var(--ink);
    border-color:var(--gold-light);
  }
  .chip-count{
    font-weight:400;
    opacity:0.85;
  }

  /* ---------- Recherche (pressoir ou commune) ---------- */
  .search-panel{
    background:var(--chalk);
    border:1px solid var(--gold-light);
    border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
    padding:10px;
    width:230px;
  }
  .search-input{
    width:100%;
    box-sizing:border-box;
    border:1px solid var(--gold-light);
    border-radius:6px;
    padding:7px 10px;
    font-family:'Inter', sans-serif;
    font-size:0.8rem;
    color:var(--ink);
    background:var(--ivory);
  }
  .search-input:focus{
    outline:none;
    border-color:var(--gold);
  }
  .search-results{
    display:none;
    margin-top:6px;
    max-height:260px;
    overflow-y:auto;
  }
  .search-results.visible{
    display:block;
  }
  .search-result{
    display:flex;
    flex-direction:column;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
  }
  .search-result:hover{
    background:var(--gold-light);
  }
  .search-result-title{
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink);
  }
  .search-result-sub{
    font-size:0.68rem;
    color:var(--brown);
  }
  .search-empty{
    padding:6px 8px;
    font-size:0.76rem;
    color:var(--brown);
    font-style:italic;
  }

  /* ---------- Marqueurs commune : style "point discret" ---------- */
  .dot-icon-wrapper{background:transparent;border:none;}
  .dot-marker{
    border-radius:50%;
    border:1.5px solid rgba(245,241,232,0.9);
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  .commune-tooltip{
    font-size:0.68rem;
    font-family:'Inter', sans-serif;
    background:var(--vine-dark);
    color:var(--chalk);
    border:none;
    padding:3px 8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .commune-tooltip::before{
    border-top-color:var(--vine-dark);
  }

  /* ---------- Marqueurs commune : style "pastille compacte" ---------- */
  .pill-icon-wrapper{
    background:transparent;
    border:none;
    transform:translate(-50%, -50%);
  }
  .pill-marker{
    display:flex;
    align-items:center;
    gap:5px;
    padding:3px 9px 3px 6px;
    border-radius:14px;
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
    border:1px solid rgba(245,241,232,0.85);
  }
  .pill-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(245,241,232,0.9);
    flex:0 0 auto;
  }
  .pill-name{
    font-size:0.58rem;
    font-weight:600;
    color:var(--chalk);
  }
  .pill-count{
    font-size:0.58rem;
    font-weight:700;
    color:var(--chalk);
    background:rgba(0,0,0,0.2);
    border-radius:8px;
    padding:0 5px;
  }

  /* ---------- Marqueurs commune : style "chiffre seul" ---------- */
  .figure-icon-wrapper{
    background:transparent;
    border:none;
    transform:translate(-50%, -50%);
  }
  .figure-marker{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:var(--chalk);
    font-weight:700;
    border:1.5px solid rgba(245,241,232,0.9);
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }

  .commune-name-popup .leaflet-popup-content-wrapper{
    background:var(--chalk);
    border-top:3px solid var(--gold);
    border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
  }
  .commune-name-popup .leaflet-popup-content{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.9rem;
    color:var(--vine);
    margin:8px 12px;
  }
  .commune-name-popup .leaflet-popup-tip{
    background:var(--gold);
  }

  /* ---------- Marqueur pressoir individuel ---------- */
  /* Le fond (couleur du courtier référent) est posé en style inline par le JS. */
  .pressoir-icon-wrapper{background:transparent;border:none;}
  .pressoir-marker{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--gold);
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }

  /* ---------- Popups Leaflet (habillage général) ---------- */
  .leaflet-popup-content-wrapper{
    background:var(--chalk);
    border-top:3px solid var(--gold);
    border-radius:6px;
  }
  .leaflet-popup-tip{
    background:var(--gold);
  }
  .pressoir-popup h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1rem;
    color:var(--vine);
    margin:0 0 6px 0;
  }
  .pressoir-popup .commune-line{
    margin:0 0 8px 0;
    font-style:italic;
    color:var(--brown);
    font-size:0.82rem;
  }
  .pressoir-popup p{
    margin:0 0 4px 0;
    font-size:0.82rem;
  }

  /* ---------- Clusters : intégration à la palette ---------- */
  .marker-cluster-small{
    background-color:rgba(201,166,107,0.55);
  }
  .marker-cluster-small div{
    background-color:rgba(31,58,46,0.85);
    color:var(--chalk);
  }
  .marker-cluster-medium{
    background-color:rgba(140,90,60,0.55);
  }
  .marker-cluster-medium div{
    background-color:rgba(107,39,55,0.85);
    color:var(--chalk);
  }
  .marker-cluster-large{
    background-color:rgba(107,39,55,0.55);
  }
  .marker-cluster-large div{
    background-color:rgba(18,37,28,0.9);
    color:var(--chalk);
  }
</style>
</head>

<div id="map-wrapper">

</div>

  // =========================================================================
  // Paramètres de la carte
  // =========================================================================
  var ZOOM_THRESHOLD = 11.5;      // seuil de bascule commune <-> pressoirs
  var BOUNDS_PADDING = 0.35;      // padding généreux autour des communes

  // Calcul du bornage de navigation à partir du min/max des coordonnées
  // des communes, avec un padding généreux. Aucune découpe visuelle du fond
  // de carte : uniquement une contrainte de déplacement/zoom.
  var lats = communes.map(function(c){ return c.lat; });
  var lngs = communes.map(function(c){ return c.lng; });
  var minLat = Math.min.apply(null, lats) - BOUNDS_PADDING;
  var maxLat = Math.max.apply(null, lats) + BOUNDS_PADDING;
  var minLng = Math.min.apply(null, lngs) - BOUNDS_PADDING;
  var maxLng = Math.max.apply(null, lngs) + BOUNDS_PADDING;
  var champagneBounds = L.latLngBounds([minLat, minLng], [maxLat, maxLng]);

  // zoomSnap doit rester entier : avec un pas fractionné (ex. 0.1), le
  // rendu des marqueurs isolés (non regroupés) de Leaflet.markercluster
  // 1.5.3 échoue silencieusement (aucune icône créée) dès qu'un cluster ne
  // contient qu'un seul point à l'écran. Zoom initial ~9.3 → arrondi à 9.
  var map = L.map('map', {
    center: [48.66, 4.07],
    zoom: 9,
    zoomSnap: 1,
    zoomDelta: 1,
    maxBoundsViscosity: 1.0
  });

  // Fonds de carte disponibles, sélectionnables via le panneau de contrôle.
  // Un seul est ajouté à la carte à la fois (basemaps[currentBasemap]) ; les
  // couches de marqueurs/clusters ne sont pas affectées par le changement.
  var basemaps = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
      maxZoom: 19
    }),
    relief: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
      maxZoom: 17
    }),
    epure: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19,
      subdomains: 'abcd'
    })
  };
  var currentBasemap = 'osm';
  basemaps[currentBasemap].addTo(map);

  function switchBasemap(key){
    if(key === currentBasemap) return;
    map.removeLayer(basemaps[currentBasemap]);
    currentBasemap = key;
    basemaps[currentBasemap].addTo(map);
  }

  // minZoom cohérent = zoom auquel les bounds remplissent tout juste la vue :
  // impossible de dézoomer davantage, donc impossible de sortir de la zone.
  var minZoomForBounds = map.getBoundsZoom(champagneBounds);
  map.setMinZoom(minZoomForBounds);
  map.setMaxBounds(champagneBounds);

  // =========================================================================
  // Utilitaires de style (couleur par courtier / taille selon le nombre de pressoirs)
  // =========================================================================
  // Couleur d'une commune : basée sur le courtier1 (référent principal) de
  // chaque pressoir affiché — un courtier2 éventuel n'entre jamais en jeu
  // dans la couleur. Si tous les pressoirs partagent le même courtier1, on
  // prend sa couleur ; dès qu'il y en a plusieurs, couleur neutre.
  function colorForCommunePressoirs(pressoirs){
    var courtiersPresents = new Set(pressoirs.map(function(p){ return p.courtier1; }));
    if(courtiersPresents.size === 1){
      return COURTIER_COLORS[pressoirs[0].courtier1];
    }
    return NEUTRAL_COLOR;
  }

  function sizeForCount(n){
    if(n <= 1) return 14;
    if(n === 2) return 18;
    if(n === 3) return 22;
    return 26;
  }

  // =========================================================================
  // État courant : style d'étiquette actif + filtres courtier(s)/secteur(s)
  // =========================================================================
  var currentStyle = 'pill'; // 'dot' | 'pill' | 'figure'
  var selectedCourtiers = new Set(); // vide => "Tous"
  var selectedSecteurs = new Set();  // vide => "Tous"
  // Assignée par StyleFilterControl : permet à d'autres contrôles (recherche)
  // de rafraîchir les compteurs des chips courtier après un reset de filtre.
  var refreshCourtierChipLabelsRef = null;

  var communeLayerGroup = L.layerGroup();
  var clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 55,
    spiderfyOnMaxZoom: true
  });

  function pressoirMatchCourtiers(p){
    return selectedCourtiers.size === 0 ||
      selectedCourtiers.has(p.courtier1) ||
      (p.courtier2 && selectedCourtiers.has(p.courtier2));
  }

  function pressoirMatchSecteur(p){
    return selectedSecteurs.size === 0 || (p.secteur && selectedSecteurs.has(p.secteur));
  }

  // Filtre : ne conserve que les pressoirs correspondant à la fois au(x)
  // courtier(s) sélectionné(s) (courtier1 référent OU courtier2 secondaire)
  // ET au(x) secteur(s) sélectionné(s), puis retire entièrement les communes
  // qui n'ont plus aucun pressoir correspondant (masquage total, pas de grisé).
  function getFilteredCommunes(){
    return communes
      .map(function(c){
        var pressoirs = c.pressoirs.filter(function(p){
          return pressoirMatchCourtiers(p) && pressoirMatchSecteur(p);
        });
        return { nom: c.nom, lat: c.lat, lng: c.lng, pressoirs: pressoirs };
      })
      .filter(function(c){ return c.pressoirs.length > 0; });
  }

  // Compte, pour chaque courtier, le nombre de pressoirs où il est référent
  // (courtier1) et où il est secondaire (courtier2), en ne tenant compte que
  // du filtre secteur actif (pas du filtre courtier lui-même, pour que
  // chaque chip reflète "combien si je sélectionne celui-ci").
  function computeCourtierCounts(){
    var counts = {};
    COURTIERS.forEach(function(k){ counts[k] = { c1: 0, c2: 0 }; });
    communes.forEach(function(c){
      c.pressoirs.forEach(function(p){
        if(!pressoirMatchSecteur(p)) return;
        if(counts[p.courtier1]) counts[p.courtier1].c1++;
        if(p.courtier2 && counts[p.courtier2]) counts[p.courtier2].c2++;
      });
    });
    return counts;
  }

  function zoomToCommune(commune){
    map.setView([commune.lat, commune.lng], ZOOM_THRESHOLD + 1.5, { animate: true });
  }

  function buildCommuneMarker(commune, style){
    var n = commune.pressoirs.length;
    var color = colorForCommunePressoirs(commune.pressoirs);
    var marker;

    if(style === 'dot'){
      var size = sizeForCount(n);
      var icon = L.divIcon({
        className: 'dot-icon-wrapper',
        html: '<div class="dot-marker" style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';"></div>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
      marker = L.marker([commune.lat, commune.lng], { icon: icon });
      marker.bindTooltip(commune.nom + ' · ' + n, {
        direction: 'top',
        offset: [0, -size / 2 - 2],
        className: 'commune-tooltip'
      });
    } else if(style === 'figure'){
      var fsize = sizeForCount(n);
      var ficon = L.divIcon({
        className: 'figure-icon-wrapper',
        html: '<div class="figure-marker" style="width:' + fsize + 'px;height:' + fsize + 'px;background:' + color + ';font-size:0.62rem;">' + n + '</div>',
        iconSize: null
      });
      marker = L.marker([commune.lat, commune.lng], { icon: ficon });
      marker.bindPopup(
        '<div class="commune-popup">' + commune.nom + '</div>',
        { closeButton: false, className: 'commune-name-popup' }
      );
    } else { // 'pill' — pastille compacte (style par défaut)
      var picon = L.divIcon({
        className: 'pill-icon-wrapper',
        html: '<div class="pill-marker" style="background:' + color + ';">' +
                '<span class="pill-dot"></span>' +
                '<span class="pill-name">' + commune.nom + '</span>' +
                '<span class="pill-count">' + n + '</span>' +
              '</div>',
        iconSize: null
      });
      marker = L.marker([commune.lat, commune.lng], { icon: picon });
    }

    marker.on('click', function(){ zoomToCommune(commune); });
    return marker;
  }

  function buildPressoirMarker(commune, pressoir){
    // La couleur reflète toujours le courtier1 (référent principal), même
    // si ce marqueur n'est affiché que parce qu'il correspond au filtre
    // sur courtier2 (secondaire).
    var color = COURTIER_COLORS[pressoir.courtier1];
    var icon = L.divIcon({
      className: 'pressoir-icon-wrapper',
      html: '<div class="pressoir-marker" style="background:' + color + ';"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    // Un pressoir géocodé précisément (lat/lng propres, ex. depuis son
    // adresse postale) est positionné à cet endroit exact ; à défaut, il
    // reprend la position générique de sa commune.
    var lat = pressoir.lat != null ? pressoir.lat : commune.lat;
    var lng = pressoir.lng != null ? pressoir.lng : commune.lng;
    var marker = L.marker([lat, lng], { icon: icon });
    // Référence gardée pour la recherche : permet de retrouver ce marqueur
    // précis dans clusterGroup afin d'y zoomer/spiderfier depuis un résultat.
    marker._pressoirRef = pressoir;
    var courtierLines = '<p><strong>Courtier référent :</strong> ' + pressoir.courtier1 + '</p>';
    if(pressoir.courtier2){
      courtierLines += '<p><strong>Courtier secondaire :</strong> ' + pressoir.courtier2 + '</p>';
    }
    // La capacité n'est renseignée que pour certains pressoirs (donnée
    // absente du fichier source réel) : ligne affichée uniquement si présente.
    var capaciteLine = pressoir.capacite != null
      ? '<p><strong>Capacité indicative :</strong> ' + pressoir.capacite.toLocaleString('fr-FR') + ' kg/marc</p>'
      : '';
    var popupHtml =
      '<div class="pressoir-popup">' +
        '<h3>' + pressoir.nom + '</h3>' +
        '<p class="commune-line">' + commune.nom + '</p>' +
        capaciteLine +
        courtierLines +
      '</div>';
    marker.bindPopup(popupHtml);
    return marker;
  }

  function rebuildCommuneLayer(){
    communeLayerGroup.clearLayers();
    getFilteredCommunes().forEach(function(c){
      communeLayerGroup.addLayer(buildCommuneMarker(c, currentStyle));
    });
  }

  function rebuildClusterGroup(){
    clusterGroup.clearLayers();
    var markers = [];
    getFilteredCommunes().forEach(function(c){
      c.pressoirs.forEach(function(p){
        markers.push(buildPressoirMarker(c, p));
      });
    });
    clusterGroup.addLayers(markers);
  }

  // Bascule entre la vue "communes" et la vue "pressoirs" selon le seuil de zoom.
  var banner = document.getElementById('zoom-banner');
  function updateLayersForZoom(){
    var z = map.getZoom();
    if(z < ZOOM_THRESHOLD){
      if(map.hasLayer(clusterGroup)) map.removeLayer(clusterGroup);
      if(!map.hasLayer(communeLayerGroup)) map.addLayer(communeLayerGroup);
      banner.classList.remove('hidden');
    } else {
      if(map.hasLayer(communeLayerGroup)) map.removeLayer(communeLayerGroup);
      if(!map.hasLayer(clusterGroup)) map.addLayer(clusterGroup);
      banner.classList.add('hidden');
    }
  }
  map.on('zoomend', updateLayersForZoom);

  // =========================================================================
  // Contrôle : sélecteur de style + filtre courtier (haut gauche)
  // =========================================================================
  // Fond de carte + style des communes (haut gauche)
  var BasemapStyleControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function(){
      var container = L.DomUtil.create('div', 'control-panel');

      container.innerHTML =
        '<div class="basemap-box">' +
          '<div class="panel-title">Fond de carte</div>' +
          '<button class="style-btn active" data-basemap="osm">Standard (OSM)</button>' +
          '<button class="style-btn" data-basemap="satellite">Satellite</button>' +
          '<button class="style-btn" data-basemap="relief">Relief</button>' +
          '<button class="style-btn" data-basemap="epure">Épuré</button>' +
        '</div>' +
        '<div class="style-box">' +
          '<div class="panel-title">Style des communes</div>' +
          '<button class="style-btn" data-style="dot">Point discret</button>' +
          '<button class="style-btn active" data-style="pill">Pastille compacte</button>' +
          '<button class="style-btn" data-style="figure">Chiffre seul</button>' +
        '</div>';

      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      // Boutons de fond de carte : un seul actif à la fois
      var basemapBtns = container.querySelectorAll('[data-basemap]');
      basemapBtns.forEach(function(btn){
        btn.addEventListener('click', function(){
          basemapBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          switchBasemap(btn.getAttribute('data-basemap'));
        });
      });

      // Boutons de style : un seul actif à la fois
      var styleBtns = container.querySelectorAll('[data-style]');
      styleBtns.forEach(function(btn){
        btn.addEventListener('click', function(){
          styleBtns.forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          currentStyle = btn.getAttribute('data-style');
          rebuildCommuneLayer();
        });
      });

      return container;
    }
  });
  new BasemapStyleControl().addTo(map);

  // Filtres secteur + courtier (haut droite, au-dessus de la recherche —
  // voir l'ordre d'ajout à la carte plus bas)
  var FilterControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function(){
      var container = L.DomUtil.create('div', 'control-panel');

      var courtierChipsHtml = COURTIERS.map(function(k){
        var bg = COURTIER_COLORS[k];
        var fg = COURTIER_TEXT_COLORS[k];
        return '<button class="chip" data-courtier="' + k + '" style="background:' + bg + ';color:' + fg + ';">' + k + '</button>';
      }).join('');

      var secteurChipsHtml = SECTEURS.map(function(s){
        return '<button class="chip chip-secteur" data-secteur="' + s + '">' + s + '</button>';
      }).join('');

      container.innerHTML =
        '<div class="filter-box">' +
          '<div class="panel-title">Filtrer par secteur</div>' +
          '<div class="chips">' +
            '<button class="chip chip-all chip-secteur active" data-secteur="__all">Tous</button>' +
            secteurChipsHtml +
          '</div>' +
        '</div>' +
        '<div class="filter-box">' +
          '<div class="panel-title">Filtrer par courtier</div>' +
          '<div class="chips">' +
            '<button class="chip chip-all active" data-courtier="__all">Tous</button>' +
            courtierChipsHtml +
          '</div>' +
        '</div>';

      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      // Chips courtier : sélection multiple, "Tous" réinitialise. Le libellé
      // de chaque chip affiche le nombre de pressoirs où ce courtier est
      // référent (courtier1) et secondaire (courtier2), recalculé selon le
      // filtre secteur actif.
      var courtierAllChip = container.querySelector('[data-courtier="__all"]');
      var courtierChips = container.querySelectorAll('[data-courtier]:not([data-courtier="__all"])');

      function refreshCourtierChipLabels(){
        var counts = computeCourtierCounts();
        courtierChips.forEach(function(chip){
          var k = chip.getAttribute('data-courtier');
          var c = counts[k] || { c1: 0, c2: 0 };
          chip.innerHTML = k + ' <span class="chip-count">' + c.c1 + '+' + c.c2 + '</span>';
        });
      }
      refreshCourtierChipLabels();
      refreshCourtierChipLabelsRef = refreshCourtierChipLabels;

      courtierAllChip.addEventListener('click', function(){
        selectedCourtiers.clear();
        courtierAllChip.classList.add('active');
        courtierChips.forEach(function(c){ c.classList.remove('active'); });
        rebuildCommuneLayer();
        rebuildClusterGroup();
      });

      courtierChips.forEach(function(chip){
        chip.addEventListener('click', function(){
          var k = chip.getAttribute('data-courtier');
          if(selectedCourtiers.has(k)){
            selectedCourtiers.delete(k);
            chip.classList.remove('active');
          } else {
            selectedCourtiers.add(k);
            chip.classList.add('active');
          }
          courtierAllChip.classList.toggle('active', selectedCourtiers.size === 0);
          rebuildCommuneLayer();
          rebuildClusterGroup();
        });
      });

      // Chips secteur : sélection multiple, "Tous" réinitialise. Change le
      // périmètre pris en compte par les compteurs des chips courtier.
      var secteurAllChip = container.querySelector('[data-secteur="__all"]');
      var secteurChips = container.querySelectorAll('[data-secteur]:not([data-secteur="__all"])');

      secteurAllChip.addEventListener('click', function(){
        selectedSecteurs.clear();
        secteurAllChip.classList.add('active');
        secteurChips.forEach(function(c){ c.classList.remove('active'); });
        rebuildCommuneLayer();
        rebuildClusterGroup();
        refreshCourtierChipLabels();
      });

      secteurChips.forEach(function(chip){
        chip.addEventListener('click', function(){
          var s = chip.getAttribute('data-secteur');
          if(selectedSecteurs.has(s)){
            selectedSecteurs.delete(s);
            chip.classList.remove('active');
          } else {
            selectedSecteurs.add(s);
            chip.classList.add('active');
          }
          secteurAllChip.classList.toggle('active', selectedSecteurs.size === 0);
          rebuildCommuneLayer();
          rebuildClusterGroup();
          refreshCourtierChipLabels();
        });
      });

      return container;
    }
  });
  new FilterControl().addTo(map);

  // =========================================================================
  // Contrôle : recherche par nom de pressoir ou de commune (haut droite)
  // =========================================================================
  var SEARCH_RESULTS_LIMIT = 8;

  // Normalisation insensible à la casse/accents pour comparer les saisies
  // libres aux noms (ex. "epernay" doit trouver "Épernay").
  function normalizeSearchText(str){
    return str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  // Recherche à la fois sur le nom de commune et sur le nom de chaque
  // pressoir (toutes communes confondues, indépendamment du filtre courtier
  // actif, pour que la recherche trouve toujours ce qu'on lui demande).
  function searchCommunesEtPressoirs(query){
    var q = normalizeSearchText(query.trim());
    if(!q) return [];
    var results = [];
    communes.forEach(function(c){
      if(normalizeSearchText(c.nom).indexOf(q) !== -1){
        results.push({ type: 'commune', commune: c });
      }
      c.pressoirs.forEach(function(p){
        if(normalizeSearchText(p.nom).indexOf(q) !== -1){
          results.push({ type: 'pressoir', commune: c, pressoir: p });
        }
      });
    });
    return results.slice(0, SEARCH_RESULTS_LIMIT);
  }

  // Réinitialise les filtres courtier et secteur (UI + état) : utilisé quand
  // un résultat de recherche est masqué par un filtre actif, pour garantir
  // qu'on montre toujours ce qu'on a trouvé.
  function resetCourtierFilterUI(){
    selectedCourtiers.clear();
    var allChip = document.querySelector('[data-courtier="__all"]');
    var courtierChips = document.querySelectorAll('[data-courtier]:not([data-courtier="__all"])');
    if(allChip) allChip.classList.add('active');
    courtierChips.forEach(function(c){ c.classList.remove('active'); });
    rebuildCommuneLayer();
    rebuildClusterGroup();
  }

  function resetSecteurFilterUI(){
    selectedSecteurs.clear();
    var allChip = document.querySelector('[data-secteur="__all"]');
    var secteurChips = document.querySelectorAll('[data-secteur]:not([data-secteur="__all"])');
    if(allChip) allChip.classList.add('active');
    secteurChips.forEach(function(c){ c.classList.remove('active'); });
    rebuildCommuneLayer();
    rebuildClusterGroup();
    if(refreshCourtierChipLabelsRef) refreshCourtierChipLabelsRef();
  }

  // Zoome sur un pressoir précis et ouvre sa popup, en dépliant (spiderfy)
  // le cluster si nécessaire — zoomToShowLayer gère ça nativement, y
  // compris quand plusieurs pressoirs partagent exactement la même position.
  function revealPressoir(commune, pressoir){
    if(!pressoirMatchCourtiers(pressoir)){
      resetCourtierFilterUI();
    }
    if(!pressoirMatchSecteur(pressoir)){
      resetSecteurFilterUI();
    }
    var lat = pressoir.lat != null ? pressoir.lat : commune.lat;
    var lng = pressoir.lng != null ? pressoir.lng : commune.lng;
    map.setView([lat, lng], ZOOM_THRESHOLD + 1.5, { animate: true });
    map.once('moveend', function(){
      var target = null;
      clusterGroup.getLayers().forEach(function(m){
        if(m._pressoirRef === pressoir) target = m;
      });
      if(target){
        clusterGroup.zoomToShowLayer(target, function(){
          target.openPopup();
        });
      }
    });
  }

  var SearchControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function(){
      var container = L.DomUtil.create('div', 'search-panel');
      container.innerHTML =
        '<input type="text" class="search-input" placeholder="Rechercher un pressoir ou une commune…" />' +
        '<div class="search-results"></div>';

      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      var input = container.querySelector('.search-input');
      var resultsEl = container.querySelector('.search-results');
      var currentResults = [];

      function renderResults(){
        if(currentResults.length === 0){
          resultsEl.innerHTML = '<div class="search-empty">Aucun résultat</div>';
        } else {
          resultsEl.innerHTML = currentResults.map(function(r, i){
            if(r.type === 'commune'){
              return '<div class="search-result" data-index="' + i + '">' +
                '<span class="search-result-title">' + r.commune.nom + '</span>' +
                '<span class="search-result-sub">Commune · ' + r.commune.pressoirs.length + ' pressoir(s)</span>' +
              '</div>';
            }
            return '<div class="search-result" data-index="' + i + '">' +
              '<span class="search-result-title">' + r.pressoir.nom + '</span>' +
              '<span class="search-result-sub">' + r.commune.nom + '</span>' +
            '</div>';
          }).join('');
        }
        resultsEl.classList.add('visible');

        resultsEl.querySelectorAll('.search-result').forEach(function(el){
          el.addEventListener('click', function(){
            var r = currentResults[parseInt(el.getAttribute('data-index'), 10)];
            if(r.type === 'commune'){
              zoomToCommune(r.commune);
            } else {
              revealPressoir(r.commune, r.pressoir);
            }
            input.value = '';
            resultsEl.classList.remove('visible');
            resultsEl.innerHTML = '';
          });
        });
      }

      input.addEventListener('input', function(){
        var q = input.value;
        if(!q.trim()){
          resultsEl.classList.remove('visible');
          resultsEl.innerHTML = '';
          return;
        }
        currentResults = searchCommunesEtPressoirs(q);
        renderResults();
      });

      return container;
    }
  });
  new SearchControl().addTo(map);

  // =========================================================================
  // Initialisation
  // =========================================================================
  rebuildCommuneLayer();
  rebuildClusterGroup();
  updateLayersForZoom();

})();
</script>

</body>
</html>
